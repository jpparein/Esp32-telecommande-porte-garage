<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Arial, sans-serif">
<title>Détection d'un mouvement manuel par la lumière</title>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2328"/></marker></defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="40" y="44" font-size="26" font-weight="700" fill="#1d2328">Appli ou mouvement manuel ?</text>
<text x="40" y="70" font-size="14" fill="#5c6770">Le boîtier allume son ampoule à chaque mouvement. Le capteur KY-018 (D34) la voit.</text>

<!-- Organigramme -->
<rect x="40" y="100" width="250" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
<text x="165" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">L'ampoule s'allume</text>
<text x="165" y="152" text-anchor="middle" font-size="13" fill="#713f12">écart &gt; seuil, 3 lectures de suite</text>
<path d="M290,135 H350" stroke="#1d2328" stroke-width="3" fill="none" marker-end="url(#a)"/>

<polygon points="350,135 500,75 650,135 500,195" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="500" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Ordre de l'appli</text>
<text x="500" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">dans les N secondes ?</text>

<path d="M650,135 H730" stroke="#1d2328" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="690" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">OUI</text>
<rect x="730" y="100" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="880" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Normal : la lumière vient du relais</text>
<text x="880" y="152" text-anchor="middle" font-size="13" fill="#166534">rien de plus dans l'historique</text>

<path d="M500,195 V250" stroke="#1d2328" stroke-width="3" fill="none" marker-end="url(#a)"/>
<text x="518" y="228" font-size="13" font-weight="700" fill="#b91c1c">NON</text>
<rect x="320" y="250" width="360" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="500" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Historique : « Mouvement manuel »</text>
<text x="500" y="302" text-anchor="middle" font-size="13" fill="#991b1b">interrupteur manuel ou télécommande d'origine</text>

<!-- Réglages -->
<rect x="760" y="230" width="400" height="120" rx="10" fill="#f1f3f5" stroke="#9aa5ad" stroke-width="2"/>
<text x="780" y="258" font-size="14" font-weight="700" fill="#1d2328">Réglages dans l'appli</text>
<g font-size="13" fill="#1d2328">
<text x="780" y="284">Sensibilité (seuil) : 50 à 2000, utilisé : 1500</text>
<text x="780" y="306">N = fenêtre après un ordre : 5 à 120 s, défaut 30 s</text>
<text x="780" y="328">Lecture toutes les 0,1 s, référence lente</text>
</g>

<!-- Courbe -->
<text x="40" y="370" font-size="16" font-weight="700" fill="#1d2328">Ce que lit le capteur (valeur sur 4095)</text>
<line x1="120" y1="420" x2="1120" y2="420" stroke="#9aa5ad"/>
<line x1="120" y1="560" x2="1120" y2="560" stroke="#9aa5ad"/>
<line x1="120" y1="400" x2="120" y2="580" stroke="#1d2328" stroke-width="2"/>
<text x="110" y="425" font-size="12" fill="#5c6770" text-anchor="end">≈ 3900</text>
<text x="110" y="565" font-size="12" fill="#5c6770" text-anchor="end">≈ 0</text>
<text x="60" y="400" font-size="11" fill="#5c6770">sombre</text>
<text x="60" y="582" font-size="11" fill="#5c6770">lumière</text>
<polyline points="120,420 360,420 360,560 760,560 760,420 1120,420" fill="none" stroke="#2563eb" stroke-width="4"/>
<line x1="120" y1="470" x2="1120" y2="470" stroke="#dc2626" stroke-dasharray="6 5" stroke-width="2"/>
<text x="1120" y="462" font-size="12" fill="#b91c1c" text-anchor="end">référence − seuil : en dessous = « allumée »</text>
<line x1="360" y1="395" x2="360" y2="600" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 4"/>
<text x="368" y="392" font-size="12" font-weight="700" fill="#b91c1c">décision ici</text>
<text x="560" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">ampoule allumée environ 3 min 20 s</text>
<text x="120" y="614" font-size="12" fill="#5c6770">temps</text>
<text x="1120" y="614" font-size="12" fill="#5c6770" text-anchor="end">Limite : un second appui pendant que l'ampoule est allumée n'est pas vu.</text>
</svg>
